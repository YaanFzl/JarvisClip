name: build

# Every push to main is tested, built and published as a release with the
# next patch version (v0.1.1, v0.1.2, ...). Push a tag like v0.2.0 yourself
# for a bigger jump; numbering continues from the newest tag. Pull requests
# are only built and tested.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Runs for main queue up instead of overlapping, so two quick pushes can't
# both claim the same version number.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # to publish releases
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to work out the next version

      - name: Pick version
        id: version
        shell: bash
        run: |
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
            release=true
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            existing=$(git tag --points-at HEAD --list 'v*' | head -1)
            if [[ -n "$existing" ]]; then
              # Tagged by hand: that tag's own run publishes it.
              echo "HEAD is already tagged $existing, not releasing again"
              version="$existing"
            else
              latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
              IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
              version="${major}.${minor}.$((patch + 1))"
              release=true
            fi
          else
            version="v0.0.0-dev"
          fi
          echo "Version: $version (release: $release)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          # Baked into the exe (shows up in the log).
          echo "JARVIS_CLIP_VERSION=${version#v}" >> "$GITHUB_ENV"

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Get the voice files
        shell: pwsh
        run: |
          # Same files and hashes as DOWNLOADS in src/voice.rs.
          $files = @(
            @{ url = 'https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-win64-0.3.45.zip'; sha = 'f1dcc9cca460630f81ea8f71794f69c80bed6556d2a4e6237b5785e1d2dff34b' },
            @{ url = 'https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip'; sha = '30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498' }
          )
          $work = Join-Path $env:RUNNER_TEMP vosk
          New-Item -ItemType Directory -Force $work, dist/vosk | Out-Null
          foreach ($f in $files) {
            $zip = Join-Path $work download.zip
            Invoke-WebRequest $f.url -OutFile $zip
            if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $f.sha) { throw "Checksum mismatch: $($f.url)" }
            Expand-Archive $zip $work -Force
          }
          Move-Item "$work/vosk-win64-0.3.45/*.dll" dist/vosk
          Move-Item "$work/vosk-model-small-en-us-0.15" dist/vosk/model

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc /Q "/DAppVersion=$env:JARVIS_CLIP_VERSION" installer.iss
          if ($LASTEXITCODE) { throw 'Inno Setup failed' }

      - uses: actions/upload-artifact@v7
        with:
          name: jarvis-clip-${{ steps.version.outputs.version }}
          path: |
            target/release/jarvis-clip.exe
            dist/JarvisClip-Setup.exe

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="- **JarvisClip-Setup.exe**: the installer. Includes the voice files, adds a Start Menu shortcut and an uninstaller. No admin needed.
          - **jarvis-clip.exe**: the portable app. Put it in a folder of its own; the first run downloads the voice files (~55 MB, once)."
          # Creates the tag too when it doesn't exist yet. Tags made with the
          # workflow token don't trigger another run.
          gh release create "$VERSION" dist/JarvisClip-Setup.exe target/release/jarvis-clip.exe \
            --target "$GITHUB_SHA" --title "Jarvis Clip $VERSION" --notes "$notes" --generate-notes
